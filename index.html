<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04030a" />
    <meta
      name="description"
      content="NEBULA — 用手势控制体积星云。握拳坍缩，张掌扩散。实时手部追踪，全部在本地运行。"
    />
    <title>NEBULA · 手势星云</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff7e8'/%3E%3Cstop offset='.45' stop-color='%23b98cff'/%3E%3Cstop offset='1' stop-color='%23120a26' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='3.4' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="stage">
      <canvas id="scene" aria-label="手势控制的体积星云"></canvas>
      <div class="scene-vignette"></div>
    </div>

    <div class="hud" id="hud">
      <header class="topbar">
        <div class="brand">
          <span class="brand-orb"></span>
          <span class="brand-name">NEBULA</span>
          <span class="brand-div"></span>
          <span class="brand-cn">手势星云</span>
        </div>
        <div class="topbar-actions">
          <div class="fps" id="fps">— FPS</div>
          <button class="icon-btn" id="btn-sound" type="button" aria-label="切换声音" aria-pressed="true" title="声音">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
              <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.4 6a8.4 8.4 0 0 1 0 12" />
              <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-full" type="button" aria-label="全屏" title="全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="energy" id="energy" aria-hidden="true">
        <div class="energy-readout"><span id="energy-value">00</span><i>%</i></div>
        <div class="energy-track">
          <div class="energy-fill" id="energy-fill"></div>
          <div class="energy-ticks">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="energy-knob" id="energy-knob"></div>
        </div>
        <div class="energy-labels"><span>坍缩</span><span>扩散</span></div>
      </aside>

      <div class="status-pill" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">未检测到手部</span>
        <span class="status-div"></span>
        <span class="status-sub" id="status-sub">将手掌放入画面</span>
      </div>

      <div class="cam" id="cam">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="cam-overlay" width="480" height="270"></canvas>
        <div class="cam-fallback" id="cam-fallback">CAMERA</div>
        <div class="cam-tag"><i class="rec"></i> CAM · LOCAL</div>
      </div>

      <div class="hint" id="hint">握拳收缩 <span>·</span> 张掌扩散 <span>·</span> 移动手掌改变视角</div>
    </div>

    <section class="landing" id="landing">
      <div class="landing-glow"></div>
      <div class="landing-inner">
        <div class="eyebrow">
          <span class="eyebrow-line"></span>
          GESTURE-DRIVEN COSMOS
          <span class="eyebrow-line"></span>
        </div>
        <h1 class="title">NEBULA</h1>
        <p class="tagline">
          握紧拳头，让星云坍缩成炽热的核心；<br />
          缓缓张掌，让它重新铺满整个宇宙。
        </p>
        <div class="actions">
          <button id="btn-start" class="btn btn-primary" type="button" disabled>
            <span>启动手势控制</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </button>
          <button id="btn-demo" class="btn btn-ghost" type="button" disabled>自动演示 · 鼠标模式</button>
        </div>
        <div class="note" id="note">需要摄像头权限 · 画面仅在本地设备处理，不会上传</div>

        <div class="boot" id="boot">
          <div class="boot-row">
            <span id="boot-label">正在编织星云噪声…</span>
            <span id="boot-pct">0%</span>
          </div>
          <div class="boot-bar"><i id="boot-fill"></i></div>
        </div>
      </div>
      <footer class="landing-foot">
        <span>VOLUMETRIC RAYMARCHING · MEDIAPIPE HAND TRACKING</span>
        <span>LOCAL · WEBGL 2</span>
      </footer>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
